[project]
name = "cubiq-api"
version = "0.1.0"
description = "Local API for the Cubiq Rubik's Cube coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "rubik-solver-py==0.1.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx2", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
